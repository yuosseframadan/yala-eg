<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0b"><title>تطبيق الطيار | yala-eg</title>
<link rel="manifest" href="manifest-rider.json"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css">
</head>
<body><div class="w">
<h1>🛵 تطبيق الطيار · <b>yala-eg</b></h1><div id="m"></div>
<div class="card" id="login" hidden>
  <h3>تسجيل دخول الطيار</h3>
  <label>رقم الهاتف أو البريد الإلكتروني</label><input id="em" autocomplete="username" dir="ltr">
  <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">
  <button class="btn" id="go">دخول</button><div class="err" id="le"></div>
</div>
<div id="panel" hidden>
  <div class="top card"><span><b id="rn"></b> <span class="mu" id="rt"></span></span><span><button class="btn s sm" id="rf5">🔄 تحديث</button> <button class="btn s sm" id="out">خروج</button></span></div>
  <div class="stats" id="sm"></div>
  <div id="inbox"></div><div id="mcash"></div><div id="payo"></div><div id="mine"></div><div id="av"></div><div id="tk"></div><div id="dn"></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="products.js"></script>
<script>
const $=id=>document.getElementById(id),sb=window.sb,E=esc;
let R=null,OS=[],mt,known=null,tick,SUM=null,INB=[],AF="",MD={groups:[],done:[]},PO=[];
function msg(t){const m=$("m");m.textContent=friendly(t);clearTimeout(mt);mt=setTimeout(()=>m.textContent="",4500)}
function show(l){$("login").hidden=l;$("panel").hidden=!l}
try{$("em").value=localStorage.getItem("rider_id")||""}catch(x){}
async function init(){
  if(!sb){show(false);$("le").textContent="تعذر تحميل مكتبة Supabase (النت؟). حدّث الصفحة.";return}
  const{data}=await sb.auth.getSession();
  if(data.session)enter(data.session.user);else show(false)}
async function enter(u){
  const{data}=await sb.from("riders").select("*").eq("user_id",u.id).maybeSingle();
  if(!data){await sb.auth.signOut();show(false);$("le").textContent="الحساب ده مش حساب طيار";return}
  if(!data.is_active){await sb.auth.signOut();show(false);$("le").textContent="حسابك موقوف، كلّم الإدارة";return}
  R=data;show(true);$("rn").textContent=R.name;$("rt").textContent=R.merchant_id?"(طيار محل)":"(طيار عام)";
  if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
  const sn=snap.get("rider");if(sn&&sn.id===R.id){OS=sn.OS||[];SUM=sn.SUM;render()}
  load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});$("rf5").onclick=()=>{load();msg("جاري التحديث…")};tick=setInterval(timers,1000)}
$("go").onclick=async()=>{
  $("le").textContent="";if(!sb)return $("le").textContent="Supabase مش متصل";
  let id=$("em").value.trim();if(!id||!$("pw").value)return $("le").textContent="اكتب الهاتف/البريد والباسورد";
  try{localStorage.setItem("rider_id",id)}catch(x){}
  const r=await signIn(sb,id,$("pw").value);
  if(r.error)return $("le").textContent=r.error;
  $("pw").value="";enter(r.user)};
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

const tm=t=>t?new Date(t).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):"—";
const mins=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/6e4))+" دقيقة":"—";
async function load(){
  const[a,b,c,d,e2]=await Promise.all([sb.rpc("rider_orders"),sb.rpc("rider_summary"),sb.rpc("rider_inbox"),sb.rpc("rider_merchant_dues"),sb.rpc("rider_payouts")]);
  if(a.error)return msg(a.error.message);
  OS=a.data||[];SUM=b.data||null;INB=c.data||[];MD=d.data||{groups:[],done:[]};PO=e2.data||[];snap.set("rider",{id:R.id,OS,SUM});
  const ids=OS.filter(o=>o.status==="open").map(o=>o.id);
  if(known&&ids.some(i=>!known.includes(i))){msg("أوردر جديد متاح للتوصيل");if("Notification" in window&&Notification.permission==="granted")new Notification("أوردر جديد متاح",{body:"في أوردر مؤكد مستني طيار"})}
  known=ids;render()}
function shops(o){
  const sp=o.kind==="special",g={};o.items.forEach(i=>{const k=i.shop||"yala-eg";(g[k]=g[k]||{addr:i.shop_address,phone:i.shop_phone,it:[]}).it.push(i)});
  return Object.entries(g).map(([n,x])=>`<div class="irow"><b>🏪 ${E(n)}</b>${x.addr?` <span class="mu">📍 ${E(x.addr)}</span>`:""}${x.phone?` <a class="btn s sm" href="tel:${E(x.phone)}">📞</a>`:""}${x.it.map(i=>`<div>• ${E(i.name)} × ${i.qty}${sp?"":` <span class="mu">(${fm(i.price*i.qty)} ج.م)</span>`}</div>`).join("")}</div>`).join("")}
function card(o,busy){
  const sp=o.kind==="special";let act="";
  const sub=sp?(o.special_cost!=null?fm(+o.special_cost)+" ج.م":"بيتحدد بعد الشراء"):fm(+o.total-+o.shipping)+" ج.م";
  const due=sp&&o.special_cost==null?fm(+o.shipping)+" ج.م + تمن المنتجات":fm(+o.total)+" ج.م";
  const ship=o.free?`<span class="pill g2">توصيل مجاني بالنقاط - حصّل ثمن المنتجات فقط</span> <small class="mu">(نصيبك ${fm(+o.orig_shipping*0.85)} ج.م بيتضاف لرصيدك عند المنصة)</small>`:`🚚 التوصيل: <b>${fm(+o.shipping)} ج.م</b>`;
  if(o.status==="open")act=busy?'<span class="mu">سلّم أوردرك الحالي الأول</span>':`<button class="btn" data-s="accept" data-id="${o.id}">🛵 أخذ الأوردر</button>`;
  else if(o.status==="accepted"){
    if(sp&&!o.phone_shown)act=`<button class="btn" data-s="show_phone" data-id="${o.id}">📞 إظهار رقم العميل (مرة واحدة)</button>`;
    else if(sp&&!o.confirmed)act=`<button class="btn" data-s="confirm" data-id="${o.id}">✔ تم التأكيد من العميل</button>`;
    else if(sp)act=`<input class="pin" data-amt="${o.id}" inputmode="decimal" placeholder="تمن المنتجات" dir="ltr" autocomplete="off"><button class="btn" data-s="pick" data-id="${o.id}">📦 تم الشراء والاستلام</button>`;
    else act=`<button class="btn" data-s="pick" data-id="${o.id}">📦 تم استلام الأوردر</button>`;
    act+=` <button class="btn s" data-rel="${o.id}">تنازل عن الأوردر</button>`}
  if(o.status==="accepted"||(o.status==="picked"&&!sp))act+=` <button class="btn d" data-fake="${o.id}">🚫 إبلاغ عن عميل وهمي</button>`;
  else if(o.status==="picked")act=`<input class="pin" data-pin="${o.id}" inputmode="numeric" maxlength="5" placeholder="كود التسليم" dir="ltr" autocomplete="off"><button class="btn" data-s="deliver" data-id="${o.id}">تم التسليم</button>`;
  const live=o.status==="accepted"||o.status==="picked"?`<div class="big">⏱ <span data-t="${o.accepted_at}">—</span> من وقت أخذ الأوردر</div>`:"";
  const full=o.status==="picked"||o.status==="delivered";let cust="";
  if(o.name&&(full||sp))cust=`<div class="irow" style="background:#0f0d0b;border-radius:6px;padding:8px"><b>👤 ${E(o.name)}</b>${o.phone?` <a class="btn s sm" href="tel:${E(o.phone)}">📞 ${E(o.phone)}</a>`:""}${o.address?`<div>📍 ${E(o.address)}</div>`:""}${o.note?`<div class="mu">ملاحظة: ${E(o.note)}</div>`:""}</div>`;
  else if(o.status==="accepted")cust='<div class="mu">بيانات العميل بتظهر بعد ما تضغط "تم استلام الأوردر"</div>';
  const wait=sp&&o.status==="accepted"&&!o.confirmed?'<div class="mu">في انتظار تأكيد المكالمة مع العميل</div>':"";
  const rep=o.status==="delivered"?`<div class="tl">أخذت: ${tm(o.accepted_at)} · استلمت: ${tm(o.picked_at)} · سلّمت: ${tm(o.delivered_at)}<br>أخذ←استلام: ${mins(o.accepted_at,o.picked_at)} · استلام←تسليم: ${mins(o.picked_at,o.delivered_at)} · الإجمالي: ${mins(o.accepted_at,o.delivered_at)}</div>`:"";
  return`<div class="ord"><div class="row"><b>${sp?"طلب خاص":"أوردر"} #${o.id}</b><span class="mu">📍 ${E(o.area||"")}</span><span class="pill">${o.status==="open"?"متاح":o.status==="accepted"?"أخدته":o.status==="picked"?"معاك":"تم"}</span></div>
${shops(o)}<div class="row"><span>🛒 سعر الأوردر: <b>${sub}</b></span><span>${ship}</span><span>💵 المطلوب تحصيله: <b>${due}</b></span></div>${cust}${wait}${live}${rep}<div class="row" style="margin-top:6px">${act}</div></div>`}
function render(){
  const mi=OS.filter(o=>o.mine&&(o.status==="accepted"||o.status==="picked")),busy=mi.length>0;
  const avAll=OS.filter(o=>!o.mine&&o.status==="open"),av=AF?avAll.filter(o=>o.area===AF):avAll,tk=OS.filter(o=>!o.mine&&(o.status==="accepted"||o.status==="picked")),dn=OS.filter(o=>o.mine&&o.status==="delivered");
  const areas=[...new Set([...(window.AREAS||[]),...avAll.map(o=>o.area).filter(Boolean)])];
  if(SUM&&SUM.blocked)msg("عليك مستحقات للمنصة ("+fm(+SUM.left)+" ج.م). سدّدها عشان تقدر تاخد أوردرات جديدة");
  if(SUM)$("sm").innerHTML=`<div><b>${SUM.count}</b>توصيلات</div><div><b>${fm(+SUM.fees)}</b>إجمالي التوصيل</div><div><b>${fm(+SUM.share)}</b>نسبة المنصة (${RIDER_RATE*100}%)</div><div><b>${fm(+SUM.net)}</b>صافيك (${100-RIDER_RATE*100}%)</div>${+SUM.special_cash?`<div><b>${fm(+SUM.special_cash)}</b>فلوس طلبات خاصة (عهدة المنصة)</div>`:""}${+SUM.merchant_due?`<div><b>${fm(+SUM.merchant_due)}</b>فلوس تجار معاك</div>`:""}<div><b>${fm(+SUM.paid)}</b>سدّدت</div>${+SUM.credit?`<div><b>${fm(+SUM.credit)}</b>رصيدك من التوصيل المجاني</div>`:""}<div><b>${fm(Math.abs(+SUM.left))}</b>${+SUM.left>=0?"المتبقي عليك للمنصة":"ليك عند المنصة"}</div><div><b>${SUM.rating?SUM.rating+" ⭐":"—"}</b>تقييمك ${SUM.reviews?"("+SUM.reviews+")":""}</div>`;
  const unread=INB.filter(n=>!n.read);
  $("inbox").innerHTML=unread.length?`<div class="card" style="border-color:var(--o)"><h3>🔔 رسائل من الإدارة (${unread.length})</h3>${unread.map(n=>`<div class="irow">${E(n.body)} <span class="mu">${new Date(n.at).toLocaleString("ar-EG")}</span></div>`).join("")}<button class="btn s" id="ibr">تم القراءة</button></div>`:"";
  $("mcash").innerHTML=MD.groups.length||MD.done.length?`<div class="card" style="border-color:var(--o)"><h3>💰 فلوس التجار معاك</h3>${MD.groups.map(g=>`<div class="irow"><div class="row"><b>${E(g.merchant)}</b>${g.merchant_phone?` <a class="btn s sm" href="tel:${E(g.merchant_phone)}">📞</a>`:""}<span>المبلغ: <b>${fm(+g.total)} ج.م</b> (${g.orders} أوردر، قيمة المنتجات كاملة)</span></div>${g.locked?`<div class="mu">إدخال الكود مقفول لحد ${new Date(g.locked_until).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}</div>`:`<div class="row"><input class="pin" data-mc="${g.merchant_id}" inputmode="numeric" maxlength="4" placeholder="كود التاجر" dir="ltr" autocomplete="off"><button class="btn" data-ms="${g.merchant_id}">تأكيد التسليم للتاجر</button></div>`}</div>`).join("")||'<div class="mu">مفيش فلوس تجار معاك دلوقتي</div>'}${MD.done.map(d=>`<div class="irow mu">${E(d.merchant)} — ${fm(+d.total)} ج.م <span class="pill g2">تم التسليم للتاجر ✅</span></div>`).join("")}</div>`:"";
  const pend=PO.filter(x=>x.status==="pending");
  $("payo").innerHTML=PO.length?`<div class="card"><h3>💵 مستحقاتك عند المنصة</h3>${PO.map(x=>`<div class="irow">${fm(+x.amount)} ج.م — ${x.status==="pending"?`<button class="btn" data-po="${x.id}">تم استلام المال</button>`:'<span class="pill g2">تم السداد ✅</span>'} <span class="mu">${new Date(x.at).toLocaleString("ar-EG")}</span></div>`).join("")}</div>`:"";
  $("mine").innerHTML=mi.length?`<div class="card" style="border-color:var(--o)"><h3>🚚 أوردرك الحالي</h3>${mi.map(o=>card(o,true)).join("")}</div>`:"";
  $("av").innerHTML=`<div class="card"><h3>📋 أوردرات مؤكدة متاحة (${av.length})</h3><select id="af"><option value="">كل المناطق</option>${areas.map(a=>`<option value="${E(a)}"${a===AF?" selected":""}>${E(a)}</option>`).join("")}</select>${busy?'<div class="mu" style="margin-bottom:6px">⚠️ مينفعش تاخد أوردر جديد قبل ما تسلّم اللي معاك.</div>':""}${av.map(o=>card(o,busy)).join("")||'<div class="mu">مفيش أوردرات مؤكدة دلوقتي</div>'}</div>`;
  $("tk").innerHTML=tk.length?`<div class="card"><h3>🔒 أوردرات اتاخدت</h3>${tk.map(o=>`<div class="irow">أوردر #${o.id} — <span class="pill z">تم أخذه</span></div>`).join("")}</div>`:"";
  $("dn").innerHTML=`<div class="card"><h3>✔ تم تسليمها (${dn.length})</h3>${dn.map(o=>card(o,busy)).join("")||'<div class="mu">مفيش</div>'}</div>`;timers()}
function timers(){document.querySelectorAll("[data-t]").forEach(x=>{const t=x.dataset.t;if(!t||t==="null")return;const s=Math.max(0,(Date.now()-new Date(t))/1e3|0);x.textContent=String(s/3600|0).padStart(2,"0")+":"+String(s%3600/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")})}
document.addEventListener("change",ev=>{if(ev.target.id==="af"){AF=ev.target.value;render()}});
document.addEventListener("click",async ev=>{
  const rl=ev.target.closest("[data-rel]");
  if(rl){if(!confirm("تتنازل عن الأوردر ده؟ هيرجع للطيارين وهيتشال من حسابك."))return;rl.disabled=true;
    const{data,error}=await sb.rpc("rider_release",{p_id:+rl.dataset.rel});
    if(error)msg(error.message);else if(data&&data.ok===false)msg(data.err);else msg("تم التنازل عن الأوردر");return load()}
  if(ev.target.closest("#ibr")){await sb.rpc("rider_inbox_read");return load()}
  const fk=ev.target.closest("[data-fake]");
  if(fk){if(!confirm("إبلاغ عن عميل وهمي؟ استخدمه بس لو الرقم غلط أو العميل بينكر الطلب تماماً. العميل هيتحظر نهائياً والأوردر هيتلغى."))return;
    return busy(fk,async()=>{const{data,error}=await sb.rpc("rider_report_fake",{p_oid:+fk.dataset.fake});if(error)msg(error.message);else if(data&&data.ok===false)msg(data.err);else msg("تم الإبلاغ وإلغاء الأوردر");load()})}
  const ms=ev.target.closest("[data-ms]");
  if(ms){const i=document.querySelector('[data-mc="'+ms.dataset.ms+'"]'),v=i?i.value.trim():"";if(!/^\d{4}$/.test(v))return msg("اكتب كود التاجر (4 أرقام)");
    return busy(ms,async()=>{const{data,error}=await sb.rpc("rider_settle_merchant",{p_merchant:+ms.dataset.ms,p_code:v});if(error)msg(error.message);else if(data&&data.ok===false)msg(data.err);else msg("تم التسليم للتاجر ✅ ("+fm(+data.total)+" ج.م)");load()})}
  const po=ev.target.closest("[data-po]");
  if(po)return busy(po,async()=>{const{data,error}=await sb.rpc("rider_confirm_payout",{p_id:+po.dataset.po});if(error)msg(error.message);else if(data&&data.ok===false)msg(data.err);else msg("تم السداد ✅");load()});
  const b=ev.target.closest("[data-s]");if(!b)return;
  const args={p_id:+b.dataset.id,p_step:b.dataset.s};
  if(b.dataset.s==="deliver"){const i=document.querySelector('[data-pin="'+b.dataset.id+'"]'),v=i?i.value.trim():"";if(!/^\d{5}$/.test(v))return msg("اكتب كود التسليم (5 أرقام) اللي مع العميل");args.p_pin=v}
  if(b.dataset.s==="pick"){const a=document.querySelector('[data-amt="'+b.dataset.id+'"]');if(a){const v=parseFloat(String(a.value).replace(",","."));if(!(v>0))return msg("اكتب تمن المنتجات اللي اشتريتها");args.p_amount=v}}
  return busy(b,async()=>{
    const{data,error}=await sb.rpc("rider_step",args);
    if(error)msg(error.message);else if(data&&data.ok===false)msg(data.err||"حالة الأوردر اتغيرت. حدّث الصفحة");
    load()})});
setInterval(()=>{if(R&&!document.hidden)load()},25000);
init();
</script>
<script src="install.js"></script>
</body></html>
